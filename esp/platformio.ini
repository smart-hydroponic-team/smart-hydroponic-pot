[platformio]
extra_configs = secrets.ini, platformio.local.ini

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = bblanchon/ArduinoJson

build_flags =
    -D API_BASE_URL='"API_BACKEND"'
    -D AP_SSID=\"${secrets.AP_SSID}\"
    -D AP_PASSWORD=\"${secrets.AP_PASSWORD}\"