[platformio]
extra_configs = secrets.ini

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Base URL of the external backend API used by ESP32 for authentication and data exchange.
build_flags =
    -D API_BASE_URL='"API_BACKEND"'
    -D AP_SSID=\"${secrets.AP_SSID}\"
    -D AP_PASSWORD=\"${secrets.AP_PASSWORD}\"